# ───────────── CSLifestyle production stack (Phase 12) ─────────────
#
# Full 5-service production profile: PostgreSQL, Redis, the Express API, the BullMQ
# worker, and the Next.js frontend. A one-shot `migrate` service applies migrations +
# seeds before the API starts.
#
#   cp .env.production.example .env.production   # then fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Notes
#   • Secrets come from --env-file (never commit real secrets).
#   • QUEUE_DRIVER=bullmq so the worker actually processes jobs.
#   • AI_DRIVER / ANALYTICS_DRIVER default to mock; set to 'live' + add keys for real providers.
#   • Uploaded media is persisted on a shared named volume mounted into api + worker.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cslifestyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cslifestyle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cslifestyle} -d ${POSTGRES_DB:-cslifestyle}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply migrations + seed, then exit. The API waits for it to complete.
  migrate:
    build: ./server
    command: ['sh', '-c', 'npx prisma migrate deploy && npx tsx prisma/seed.ts']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cslifestyle.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: ./server
    restart: unless-stopped
    command: ['node', 'dist/index.js']
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: '4000'
      QUEUE_DRIVER: bullmq
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - '4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./server
    restart: unless-stopped
    command: ['node', 'dist/jobs/worker.js']
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      QUEUE_DRIVER: bullmq
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-to-server origin the Next rewrites proxy /api/* + /uploads/* to.
      BACKEND_ORIGIN: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
