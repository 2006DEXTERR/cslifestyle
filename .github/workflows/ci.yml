name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  backend:
    name: Backend (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cslifestyle
          POSTGRES_PASSWORD: cslifestyle
          POSTGRES_DB: cslifestyle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cslifestyle"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cslifestyle:cslifestyle@localhost:5432/cslifestyle?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters-long
      APP_URL: http://localhost:3000
      RUN_DB_TESTS: 'true'
      SEED_ADMIN_EMAIL: admin@cslifestyle.in
      SEED_ADMIN_PASSWORD: ChangeMe!2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (unit + integration + RBAC)
        run: npm test
